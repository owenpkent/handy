<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handy V2 Control</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>Handy V2</h1>
            <div class="status-bar">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Disconnected</span>
                <span id="batteryStatus" class="battery-status hidden">🔋 --%</span>
            </div>
        </header>

        <!-- Setup Panel -->
        <section id="setupPanel" class="panel">
            <h2>Setup</h2>
            <div class="input-group">
                <label for="connectionKey">Connection Key</label>
                <input type="text" id="connectionKey" placeholder="Enter your connection key" autocomplete="off">
            </div>
            
            <button id="connectBtn" class="btn btn-primary btn-large">Connect</button>
        </section>

        <!-- Control Panel -->
        <section id="controlPanel" class="panel hidden">
            <!-- Stroke Position Sliders -->
            <div class="stroke-sliders">
                <div class="slider-row">
                    <label>Lowest stroke position:</label>
                    <input type="range" id="strokeMin" min="0" max="100" value="10" class="slider slider-orange">
                    <span id="strokeMinValue" class="slider-value">10</span>
                </div>
                <div class="slider-row">
                    <label>Highest stroke position:</label>
                    <input type="range" id="strokeMax" min="0" max="100" value="90" class="slider slider-orange">
                    <span id="strokeMaxValue" class="slider-value">90</span>
                </div>
            </div>

            <!-- Preset Grid -->
            <div class="preset-grid">
                <!-- Top Row -->
                <button class="preset-btn" data-speed="slow" data-position="top">Slow top</button>
                <button class="preset-btn" data-speed="medium" data-position="top">Medium top</button>
                <button class="preset-btn" data-speed="fast" data-position="top">Fast top</button>
                
                <!-- Middle Row -->
                <button class="preset-btn" data-speed="slow" data-position="middle">Slow middle</button>
                <button class="preset-btn" data-speed="medium" data-position="middle">Medium middle</button>
                <button class="preset-btn" data-speed="fast" data-position="middle">Fast middle</button>
                
                <!-- Bottom Row -->
                <button class="preset-btn" data-speed="slow" data-position="bottom">Slow Bottom</button>
                <button class="preset-btn" data-speed="medium" data-position="bottom">Medium Bottom</button>
                <button class="preset-btn" data-speed="fast" data-position="bottom">Fast Bottom</button>
                
                <!-- Full Row -->
                <button class="preset-btn" data-speed="slow" data-position="full">Slow Full</button>
                <button class="preset-btn" data-speed="medium" data-position="full">Medium Full</button>
                <button class="preset-btn" data-speed="fast" data-position="full">Fast Full</button>
                
                <!-- Natural Row -->
                <button class="preset-btn" data-speed="slow" data-position="natural">Slow Natural 🐢</button>
                <button class="preset-btn" data-speed="medium" data-position="natural">Med Natural</button>
                <button class="preset-btn" data-speed="fast" data-position="natural">Fast Natural 🚀</button>
            </div>

            <!-- Start/Stop Buttons -->
            <div class="action-buttons">
                <button id="startBtn" class="btn btn-success btn-large">START</button>
                <button id="stopBtn" class="btn btn-danger btn-large">STOP</button>
            </div>

            <!-- Speed Control -->
            <div class="speed-control-section">
                <h3>🎚️ Speed Control</h3>
                <div class="slider-row">
                    <label>Speed multiplier:</label>
                    <input type="range" id="speedMultiplier" min="10" max="100" value="100" class="slider slider-blue">
                    <span id="speedMultiplierValue" class="slider-value">100%</span>
                </div>
                <p class="control-note">Scales all speed values (Slow=25% → <span id="scaledSlow">25</span>%)</p>
            </div>

            <!-- Safety Settings -->
            <div class="safety-settings">
                <h3>⚠️ Safety Limit</h3>
                <div class="slider-row">
                    <label>Max stroke position:</label>
                    <input type="range" id="safetyMax" min="20" max="100" value="90" class="slider slider-red">
                    <span id="safetyMaxValue" class="slider-value">90</span>
                </div>
            </div>

            <!-- HRPP Experiment -->
            <div class="experiment-section">
                <h3>🧪 HRPP Experiment</h3>
                <p class="experiment-note">Try HBSP mode (mode 4) to access pattern presets</p>
                <button id="tryHrppBtn" class="btn btn-experiment">Try HRPP Mode</button>
            </div>

            <!-- Disconnect -->
            <button id="disconnectBtn" class="btn btn-outline">Disconnect</button>
        </section>

        <!-- Feedback -->
        <div id="feedback" class="feedback hidden"></div>

        <!-- Debug Panel -->
        <section id="debugPanel" class="panel debug-panel">
            <div class="debug-header">
                <h3>Debug</h3>
                <button id="clearDebugBtn" class="btn-small">Clear</button>
            </div>
            <div id="deviceState" class="debug-state">
                <div><strong>Mode:</strong> <span id="dbgMode">--</span></div>
                <div><strong>Speed:</strong> <span id="dbgSpeed">--</span></div>
                <div><strong>Stroke:</strong> <span id="dbgStroke">--</span></div>
                <div><strong>State:</strong> <span id="dbgState">--</span></div>
            </div>
            <div id="debugLog" class="debug-log"></div>
        </section>
    </div>

    <script src="handy-v2-api.js"></script>
    <script src="app.js"></script>
</body>
</html>
