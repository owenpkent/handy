<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handy V2 Control</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>SmartDong</h1>
            <div class="header-right">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Disconnected</span>
                <button id="menuBtn" class="menu-btn hidden">☰</button>
            </div>
        </header>

        <!-- Setup Panel -->
        <section id="setupPanel" class="panel">
            <h2>Setup</h2>
            <div class="input-group">
                <label for="connectionKey">Connection Key</label>
                <input type="text" id="connectionKey" placeholder="Enter your connection key" autocomplete="off">
            </div>
            
            <button id="connectBtn" class="btn btn-primary btn-large">Connect</button>
        </section>

        <!-- Control Panel -->
        <section id="controlPanel" class="panel hidden">
            <!-- Compact Controls -->
            <div class="controls-compact">
                <div class="control-row">
                    <span class="control-label">Min</span>
                    <input type="range" id="strokeMin" min="0" max="100" value="10" class="slider slider-orange">
                    <input type="number" id="strokeMinInput" min="0" max="100" value="10" class="control-input">
                </div>
                <div class="control-row">
                    <span class="control-label">Max</span>
                    <input type="range" id="strokeMax" min="0" max="100" value="90" class="slider slider-orange">
                    <input type="number" id="strokeMaxInput" min="0" max="100" value="90" class="control-input">
                </div>
                <div class="control-row">
                    <span class="control-label">Speed</span>
                    <input type="range" id="speedMultiplier" min="10" max="100" value="100" class="slider slider-blue">
                    <input type="number" id="speedMultiplierInput" min="10" max="100" value="100" class="control-input">
                </div>
                <div class="control-row">
                    <span class="control-label">G.Min</span>
                    <input type="range" id="globalMin" min="0" max="100" value="0" class="slider slider-red">
                    <input type="number" id="globalMinInput" min="0" max="100" value="0" class="control-input">
                </div>
                <div class="control-row">
                    <span class="control-label">G.Max</span>
                    <input type="range" id="globalMax" min="0" max="100" value="100" class="slider slider-red">
                    <input type="number" id="globalMaxInput" min="0" max="100" value="100" class="control-input">
                </div>
            </div>

            <!-- Preset Grid -->
            <div class="preset-grid">
                <button class="preset-btn" data-speed="slow" data-position="top">Slow Top</button>
                <button class="preset-btn" data-speed="medium" data-position="top">Med Top</button>
                <button class="preset-btn" data-speed="fast" data-position="top">Fast Top</button>
                
                <button class="preset-btn" data-speed="slow" data-position="middle">Slow Mid</button>
                <button class="preset-btn" data-speed="medium" data-position="middle">Med Mid</button>
                <button class="preset-btn" data-speed="fast" data-position="middle">Fast Mid</button>
                
                <button class="preset-btn" data-speed="slow" data-position="bottom">Slow Bot</button>
                <button class="preset-btn" data-speed="medium" data-position="bottom">Med Bot</button>
                <button class="preset-btn" data-speed="fast" data-position="bottom">Fast Bot</button>
                
                <button class="preset-btn" data-speed="slow" data-position="full">Slow Full</button>
                <button class="preset-btn" data-speed="medium" data-position="full">Med Full</button>
                <button class="preset-btn" data-speed="fast" data-position="full">Fast Full</button>
            </div>

            <!-- Start/Stop Buttons -->
            <div class="action-buttons">
                <button id="startBtn" class="btn btn-success btn-large">START</button>
                <button id="stopBtn" class="btn btn-danger btn-large">STOP</button>
            </div>

        </section>

        <!-- Settings Panel (hidden by default) -->
        <section id="settingsPanel" class="panel hidden">
            <div class="settings-header">
                <h3>⚙️ Settings</h3>
                <button id="closeSettings" class="btn-small">✕</button>
            </div>
            
            <!-- HRPP Experiment -->
            <div class="settings-section">
                <h4>🧪 HRPP Experiment</h4>
                <p class="settings-note">Try HBSP mode (mode 4) to access pattern presets</p>
                <button id="tryHrppBtn" class="btn btn-experiment">Try HRPP Mode</button>
            </div>
            
            <!-- Debug Toggle -->
            <div class="settings-section">
                <h4>🔧 Debug Panel</h4>
                <button id="toggleDebug" class="btn btn-outline">Show Debug</button>
            </div>
            
            <!-- Disconnect -->
            <div class="settings-section">
                <button id="disconnectBtn" class="btn btn-danger">Disconnect</button>
            </div>
        </section>

        <!-- Feedback -->
        <div id="feedback" class="feedback hidden"></div>

        <!-- Debug Panel (hidden by default) -->
        <section id="debugPanel" class="panel debug-panel hidden">
            <div class="debug-header">
                <h3>Debug</h3>
                <button id="clearDebugBtn" class="btn-small">Clear</button>
            </div>
            <div id="deviceState" class="debug-state">
                <div><strong>Mode:</strong> <span id="dbgMode">--</span></div>
                <div><strong>Speed:</strong> <span id="dbgSpeed">--</span></div>
                <div><strong>Stroke:</strong> <span id="dbgStroke">--</span></div>
                <div><strong>State:</strong> <span id="dbgState">--</span></div>
            </div>
            <div id="debugLog" class="debug-log"></div>
        </section>
    </div>

    <script src="handy-v2-api.js"></script>
    <script src="app.js"></script>
</body>
</html>
