set_range:
  name: Set stroke range
  description: Set the minimum and maximum stroke positions.
  fields:
    min:
      name: Min
      description: Minimum stroke position (0-100).
      required: true
      example: 10
      selector:
        number:
          min: 0
          max: 100
          mode: slider
          unit_of_measurement: "%"
    max:
      name: Max
      description: Maximum stroke position (0-100).
      required: true
      example: 90
      selector:
        number:
          min: 0
          max: 100
          mode: slider
          unit_of_measurement: "%"

preset:
  name: Apply preset
  description: Apply a speed + position preset and start motion.
  fields:
    speed:
      name: Speed
      description: Speed preset (slow=25, medium=50, fast=80).
      required: true
      example: medium
      selector:
        select:
          options:
            - slow
            - medium
            - fast
    position:
      name: Position
      description: Stroke position preset.
      required: true
      example: full
      selector:
        select:
          options:
            - top
            - middle
            - bottom
            - full
            - natural

faster:
  name: Faster
  description: Increase current speed by a delta (default 10).
  fields:
    delta:
      name: Delta
      description: Amount to increase speed by.
      required: false
      default: 10
      example: 10
      selector:
        number:
          min: 1
          max: 100
          mode: slider

slower:
  name: Slower
  description: Decrease current speed by a delta (default 10).
  fields:
    delta:
      name: Delta
      description: Amount to decrease speed by.
      required: false
      default: 10
      example: 10
      selector:
        number:
          min: 1
          max: 100
          mode: slider

start_pattern:
  name: Start pattern
  description: >-
    Start a time-based motion pattern. Cancels any pattern already running.
    The pattern's velocity envelope is multiplied by `intensity` and clamped
    to GLOBAL_MAX_SPEED before being sent to the device.
  fields:
    pattern:
      name: Pattern
      description: Pattern name (heartbeat, wave, surge, breathe, storm).
      required: true
      example: heartbeat
      selector:
        select:
          options:
            - heartbeat
            - wave
            - surge
            - breathe
            - storm
    intensity:
      name: Intensity
      description: Peak velocity for the pattern (0-100).
      required: false
      default: 50
      example: 30
      selector:
        number:
          min: 0
          max: 100
          mode: slider
          unit_of_measurement: "%"

stop_pattern:
  name: Stop pattern
  description: Cancel the running pattern (if any) and stop the device.
