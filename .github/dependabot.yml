# Dependency updates, weekly, with minor and patch bumps grouped into one pull
# request per ecosystem so the queue stays short. A major bump gets its own pull
# request. The checks run on each one; merging is the owner's call, and there
# is deliberately no auto-merge workflow. Only android-v2 is covered: the apps
# under legacy/ are frozen.
#
# Gradle: Dependabot edits android-v2/app/build.gradle.kts but does not know
# about android-v2/app/gradle.lockfile, so its pull request fails the lockfile
# check in android-tests.yml until the lockfile is regenerated. On such a pull
# request, check out the branch, run `./gradlew :app:dependencies --write-locks`
# from android-v2/, and push the result (CONTRIBUTING.md, Checks).
version: 2
updates:
  - package-ecosystem: gradle
    directory: /android-v2
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]
    # androidx.core 1.19 requires compileSdk 37 (its AAR metadata says so, and
    # checkAarMetadata fails the build). Hold it until compileSdk moves to 37;
    # drop this rule then.
    ignore:
      - dependency-name: androidx.core:core-ktx
        versions: [">= 1.19"]
      # OkHttp 5 (okhttp-android) also requires compileSdk 37. okhttp and
      # logging-interceptor must move together.
      - dependency-name: com.squareup.okhttp3:*
        versions: [">= 5"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
