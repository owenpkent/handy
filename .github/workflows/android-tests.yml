name: Android tests

# Runs the android-v2 JVM unit tests and a debug build. No emulator and no
# hardware: everything here is the Android-free logic (voice matching, dispatch,
# the Lovense protocol and transport against a fake toy) plus a compile of the app.

on:
  pull_request:
    paths:
      - "android-v2/**"
      - ".github/workflows/android-tests.yml"
  push:
    branches: [main]
    paths:
      - "android-v2/**"
      - ".github/workflows/android-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android-v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Only the active app. setup-gradle validates every Gradle wrapper
          # jar it finds, and the frozen legacy/android wrapper jar is a known
          # wrong file (see CLAUDE.md), which would fail the run.
          sparse-checkout: |
            android-v2
            .github

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Debug build
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-report
          path: android-v2/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7
