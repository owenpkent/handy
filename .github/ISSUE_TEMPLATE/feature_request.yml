name: Idea or request
description: Suggest a change, a new device, or an accessibility improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This app exists so that people who cannot easily use their hands, or whose speech ordinary voice recognition does not understand, can control a device on their own. Requests that serve that goal get priority.
  - type: textarea
    id: need
    attributes:
      label: What do you need to be able to do?
      description: Describe the situation, not only the feature. What gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea, if you have one
  - type: textarea
    id: access
    attributes:
      label: Access needs this relates to (optional)
      description: Only what you are comfortable sharing. For example, "switch access only", "cannot hold a button down", "speech is not understood by voice assistants".
